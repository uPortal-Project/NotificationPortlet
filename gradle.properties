group=org.jasig.portlet.notification
version=4.8.5-SNAPSHOT

# Matches (apparently) Spring Boot 1.5.10.RELEASE
springVersion=4.3.30.RELEASE
springSecurityVersion=4.2.9.RELEASE
springSecurityOAuth2Version=2.5.2.RELEASE

# Dependency Versions
aspectjVersion=1.9.27
commonsCodecVersion=1.23.0
commonsDbcpVersion=1.4
commonsLangVersion=2.6
commonsLang3Version=3.22.0
dozerVersion=5.5.1
ehcacheVersion=3.12.0
guavaVersion=32.0.0-jre
hibernateVersion=5.6.15.Final
httpclientVersion=3.1
httpcomponentsVersion=4.5.14
hsqldbVersion=2.7.4
# jackson-annotations is versioned independently of core/databind: as of
# Jackson 2.20 FasterXML stopped cutting patch releases of jackson-annotations
# (its API is stable), so it only ships as 2.22 while core/databind get 2.22.x
# patches. Keep this on the latest existing annotations release.
jacksonAnnotationsVersion=2.23
jacksonDatabindVersion=2.23.0
jacksonVersion=2.23.0
janinoVersion=3.1.12
jasyptVersion=1.9.3
# JJWT 0.12+ overhauled the API (builder-based parser, getPayload() instead
# of getBody(), SecretKey instead of raw String signing keys, etc.).
# jjwt-api must be declared explicitly to override the older transitive
# version pulled in through uPortal-soffit-core; jjwt-impl and jjwt-jackson
# remain runtimeOnly (Gradle does not propagate runtimeOnly transitives).
jjwtVersion=0.13.0
jodaTimeVersion=2.15.1
jsonPathVersion=2.10.0
jsonSmartVersion=2.6.1
jstlVersion=1.2
lombokVersion=1.18.48
nodejsVersion=18.13.0
resourceServerVersion=1.5.3
romeVersion=2.1.0
servletApiVersion=2.5
slf4jVersion=2.0.20
springfoxVersion=2.9.2
uPortalVersion=5.17.10-SNAPSHOT
annotationApiVersion=1.3.2
jaxbApiVersion=2.3.1

# Portlet API Dependency
portletApiDependency=org.apache.portals:portlet-api_2.1.0_spec:1.0

# gradle settings
org.gradle.parallel=true
